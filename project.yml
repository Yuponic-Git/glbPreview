name: ModelPreview
options:
  bundleIdPrefix: com.niccusworth
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  GLTFKit2:
    url: https://github.com/warrenm/GLTFKit2.git
    from: 0.5.15

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "TEAM_ID_REMOVED"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES

targets:
  # The app does nothing itself: macOS only loads a Quick Look extension that ships inside an app.
  ModelPreview:
    type: application
    platform: macOS
    sources: [App]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Model Preview
        LSApplicationCategoryType: public.app-category.graphics-design
    entitlements:
      path: App/ModelPreview.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_NAME: Model Preview
        PRODUCT_BUNDLE_IDENTIFIER: com.niccusworth.ModelPreview
    dependencies:
      - target: ModelPreviewQL
        embed: true
      # GLTFKit2 is a prebuilt framework; the extension links it and finds it in the app's Frameworks.
      - package: GLTFKit2

  ModelPreviewQL:
    type: app-extension
    platform: macOS
    sources:
      - Preview
      - path: Vendor/ufbx
        compilerFlags: ["-w"]
    dependencies:
      - package: GLTFKit2
        embed: false
    info:
      path: Preview/Info.plist
      properties:
        CFBundleDisplayName: Model Preview
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLIsDataBasedPreview: false
            QLSupportsSearchableItems: false
            QLSupportedContentTypes:
              - org.khronos.glb
              - com.autodesk.mac.fbx
    entitlements:
      path: Preview/Preview.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # FBX files often keep their textures in files beside them, outside what Quick Look opens.
        com.apple.security.temporary-exception.files.absolute-path.read-only: ["/"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niccusworth.ModelPreview.QuickLook
        SWIFT_OBJC_BRIDGING_HEADER: Preview/Preview-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/Vendor/ufbx
        CLANG_ENABLE_OBJC_ARC: YES
